<svg viewBox="0 0 860 350" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three diagrams with two axes starting from the same point, the person's horizontal and the machine's tilted. A dark arrow, the ideal pair, projects onto the two axes and its projections are the two sensitivities, 1.08 and 2.34. At 90 degrees the arrow is 2.58 long; at 75 degrees 2.39; at 62 degrees it coincides with the machine's axis, 2.34 long, and the person adds nothing more.">
